<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌳 Career Tree</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">🌳 Career Tree</div>

        <!-- STACK SELECTION -->
        <div class="stack-selector">
            <label for="stackSelect">Stack / Profession</label>
            <select id="stackSelect">
                <option value="">-- Select a stack --</option>
            </select>
        </div>

        <!-- NAVIGATION MENU -->
        <nav class="nav-menu">
            <div class="nav-group">
                <div class="nav-group-title">Profile</div>
                <button class="nav-item active" data-section="overview">
                    <span class="icon">📊</span> Overview
                </button>
                <button class="nav-item" data-section="resume">
                    <span class="icon">📄</span> Resume
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Learning</div>
                <button class="nav-item" data-section="learning-base">
                    <span class="icon">📖</span> Base
                </button>
                <button class="nav-item" data-section="learning-light">
                    <span class="icon">📖</span> Light
                </button>
                <button class="nav-item" data-section="learning-medium">
                    <span class="icon">📖</span> Medium
                </button>
                <button class="nav-item" data-section="learning-hard">
                    <span class="icon">📖</span> Hard
                </button>
                <button class="nav-item" data-section="learning-exam">
                    <span class="icon">📖</span> Exam
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Knowledge Base</div>
                <button class="nav-item" data-section="cards">
                    <span class="icon">🃏</span> Cards
                </button>
                <button class="nav-item" data-section="materials">
                    <span class="icon">📚</span> Materials & Knowledge
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Prompts</div>
                <button class="nav-item" data-section="prompts">
                    <span class="icon">⚡</span> Prompts
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">System</div>
                <button class="nav-item" data-section="settings">
                    <span class="icon">⚙️</span> Settings
                </button>
            </div>


        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main" id="mainContent">
        <!-- Content is rendered here -->
    </main>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
        </svg>
    </button>



     <script src="script.js"></script>

    <!-- LOAD STACKS - PHP -->
    <script src="skills/php/overview.js"></script>
    <script src="skills/php/resume.js"></script>
    <script src="skills/php/learning.js"></script>
    <script src="skills/php/cards.js"></script>
    <script src="skills/php/materials.js"></script>
    <script src="skills/php/prompts-data.js"></script>
    <script src="skills/php/prompts.js"></script>
    <script src="skills/php/php.js"></script>


    <!-- LOAD STACKS - English -->
    <script src="skills/english/overview.js"></script>
    <script src="skills/english/resume.js"></script>
    <script src="skills/english/learning.js"></script>
    <script src="skills/english/cards.js"></script>
    <script src="skills/english/materials.js"></script>
    <script src="skills/english/prompts-data.js"></script>
    <script src="skills/english/prompts.js"></script>
    <script src="skills/english/english.js"></script>

</body>
</html>
